<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Setări Lab Upgrade AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f3f4f6);
            --text-color: var(--tg-theme-text-color, #111827);
            --hint-color: var(--tg-theme-hint-color, #6b7280);
            --button-color: var(--tg-theme-button-color, #2563eb);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --input-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 0;
            font-size: 14px;
            color: var(--hint-color);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            color: var(--text-color);
            transition: all 0.2s ease;
            outline: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236b7280%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 16px top 50%;
            background-size: 12px auto;
            padding-right: 40px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--button-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        textarea {
            min-height: 160px; /* Увеличенная базовая высота */
            resize: vertical;  /* Позволяет пользователю тянуть поле вниз */
            line-height: 1.5;
        }

        input::placeholder, textarea::placeholder {
            color: #9ca3af;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        button:active {
            transform: scale(0.97);
            box-shadow: 0 2px 4px -1px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Setări Lab Upgrade</h2>
        <p>Configurați asistentul AI cu detaliile afacerii dvs. pentru a începe generarea vânzărilor.</p>
    </div>

    <form id="businessForm">
        <div class="form-group">
            <label>Selectați Proiectul</label>
            <select id="project_select" required>
                <option value="" disabled selected>Se încarcă proiectele...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Telefon de contact</label>
            <input type="tel" id="client_phone" required placeholder="+373 69 000 000">
        </div>

        <div class="form-group">
            <label>Email (Google Calendar)</label>
            <input type="email" id="gmail" required placeholder="exemplu@gmail.com">
        </div>

        <div class="form-group">
            <label>Nișa afacerii</label>
            <input type="text" id="business_niche" required placeholder="ex: Salon de frumusețe, Service Auto">
        </div>

        <div class="form-group">
            </label>Scopul AI-ui</label>
            <input type="text" id="bot_goal" required placeholder="Descrieți destinatia Ai-ui in forma liberă: consultare, vinzările, booking ">
        </div>

        <div class="form-group">
            <label>Context, servicii și prețuri</label>
            <textarea id="business_context" required placeholder="Descrieți detaliat serviciile oferite, prețurile și orice reguli specifice de care AI-ul ar trebui să țină cont..."></textarea>
        </div>

        <div class="form-group">
            <label>Grup de notificări (Telegram)</label>
            <input type="text" id="tg_chat_id_notify" required placeholder="Folosiți @Getmyid_bot">
        </div>

        <button type="submit">Salvează și Activează AI</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const userTgId = tg.initDataUnsafe?.user?.id;
        const urlParams = new URLSearchParams(window.location.search);
        const adminClientId = urlParams.get('state'); 

        // Глобальная переменная для хранения скачанных проектов
        let allProjects = [];

        async function loadProjects() {
            const select = document.getElementById('project_select');
            try {
                let fetchUrl = `https://n8n.labupgrade.in/webhook/get-projects?tg_id=${userTgId}`;
                if (adminClientId) {
                    fetchUrl = `https://n8n.labupgrade.in/webhook/get-projects?client_id=${adminClientId}`;
                }

                const response = await fetch(fetchUrl);
                allProjects = await response.json(); // Сохраняем все данные в переменную

                select.innerHTML = '<option value="" disabled selected>Alegeți proiectul</option>';
                
                if (Array.isArray(allProjects) && allProjects.length > 0 && allProjects[0].project_name) {
                    allProjects.forEach(p => {
                        select.innerHTML += `<option value="${p.id}">${p.project_name}</option>`;
                    });
                }
            } catch (err) {
                select.innerHTML = '<option value="" disabled selected>Alegeți proiectul</option>';
            }
        }

        // Слушаем переключение проектов в выпадающем списке
        document.getElementById('project_select').addEventListener('change', function(e) {
            const selectedId = e.target.value;
            // Ищем выбранный проект в сохраненном массиве
            const currentProject = allProjects.find(p => p.id === selectedId);
            
            if (currentProject) {
                // Подставляем значения, если они есть. Если пусто (null), оставляем пустую строку
                document.getElementById('client_phone').value = currentProject.client_phone || '';
                document.getElementById('gmail').value = currentProject.gmail || '';
                document.getElementById('business_niche').value = currentProject.business_niche || '';
                document.getElementById('business_context').value = currentProject.business_context || '';
                document.getElementById('tg_chat_id_notify').value = currentProject.tg_chat_id_notify || '';
            }
        });

        document.getElementById('businessForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.querySelector('button');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'Se salvează...';
            submitBtn.style.opacity = '0.8';

            const data = {
                telegram_id: userTgId,
                client_id: adminClientId || null,
                client_phone: document.getElementById('client_phone').value,
                gmail: document.getElementById('gmail').value,
                business_niche: document.getElementById('business_niche').value,
                bot_goal: document.getElementById('bot_goal').value,
                business_context: document.getElementById('business_context').value,
                tg_chat_id_notify: document.getElementById('tg_chat_id_notify').value,
                action: 'update',
                project_id: document.getElementById('project_select').value
            };

            fetch('https://n8n.labupgrade.in/webhook/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(response => {
                tg.close();
            }).catch(error => {
                alert("Eroare la trimiterea datelor: " + error.message);
                submitBtn.innerText = originalText;
                submitBtn.style.opacity = '1';
            });
        });

        loadProjects();
    </script>
</body>
</html>
